<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoBike ReactJS 18 SPA — Kết nối ASP.NET Core 9.0 Web API</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CATEGORIES = [
      { id: '', label: 'Tất cả dòng xe', badge: '16 xe' },
      { id: '0', label: 'Học sinh / SV (<50km/h)', badge: 'Miễn bằng A1' },
      { id: '1', label: 'Tầm trung / Đi phố', badge: '100-120k' },
      { id: '2', label: 'Đi phượt / Pin trâu', badge: '200-270km' },
      { id: '3', label: 'Thể thao / Cao cấp', badge: 'ABS 2 kênh' }
    ];

    const formatVnd = (n) => Number(n || 0).toLocaleString('vi-VN') + 'đ';

    function App() {
      const [vehicles, setVehicles] = useState([]);
      const [stats, setStats] = useState(null);
      const [coupons, setCoupons] = useState([]);
      const [loading, setLoading] = useState(true);
      const [category, setCategory] = useState('');
      const [city, setCity] = useState('');
      const [search, setSearch] = useState('');
      const [selectedVehicle, setSelectedVehicle] = useState(null);
      const [days, setDays] = useState(2);
      const [couponCode, setCouponCode] = useState('');
      const [quote, setQuote] = useState(null);

      useEffect(() => {
        Promise.all([
          fetch('/api/stats').then(r => r.json()),
          fetch('/api/coupons').then(r => r.json())
        ]).then(([s, c]) => {
          setStats(s);
          setCoupons(c);
        }).catch(console.error);
      }, []);

      useEffect(() => {
        setLoading(true);
        const params = new URLSearchParams();
        if (category !== '') params.append('category', category);
        if (city) params.append('city', city);
        if (search) params.append('search', search);

        fetch(`/api/vehicles?${params.toString()}`)
          .then(r => r.json())
          .then(data => setVehicles(data))
          .catch(console.error)
          .finally(() => setLoading(false));
      }, [category, city, search]);

      useEffect(() => {
        if (!selectedVehicle) return;
        const params = new URLSearchParams({
          vehicleId: String(selectedVehicle.id),
          days: String(days),
          couponCode: couponCode || ''
        });
        fetch(`/api/bookings/calculate?${params.toString()}`, { method: 'POST' })
          .then(r => r.json())
          .then(setQuote)
          .catch(console.error);
      }, [selectedVehicle, days, couponCode]);

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <a href="/" className="flex items-center gap-2.5 font-black text-lg text-slate-900">
                  <span className="w-9 h-9 rounded-xl bg-emerald-600 text-white flex items-center justify-center shadow-sm">
                    <i className="bi bi-lightning-charge-fill"></i>
                  </span>
                  <span>EcoBike <span className="text-emerald-600">ReactJS</span></span>
                </a>
                <span className="hidden sm:inline-block px-2.5 py-1 rounded-lg bg-sky-50 text-sky-700 border border-sky-200 text-xs font-bold">
                  React 18 SPA + ASP.NET Core 9.0 Web API
                </span>
              </div>

              <div className="flex items-center gap-2.5 text-xs font-bold">
                {stats && (
                  <div className="hidden md:flex items-center gap-3 px-3 py-1.5 rounded-xl bg-slate-100 text-slate-700">
                    <span>⚡ {stats.totalVehicles} Xe</span>
                    <span>•</span>
                    <span>👤 {stats.totalUsers} Users</span>
                    <span>•</span>
                    <span>📋 {stats.totalBookings} Đơn</span>
                  </div>
                )}
                <a href="/swagger" className="px-3.5 py-2 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 transition">
                  <i className="bi bi-braces mr-1"></i> .NET API Swagger
                </a>
                <a href="/" className="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white transition">
                  <i className="bi bi-house-door-fill mr-1"></i> Giao diện Đầy đủ
                </a>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto w-full px-4 sm:px-6 py-8 space-y-6">
            <section className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-4">
                <div>
                  <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
                    <i className="bi bi-check-circle-fill"></i> Đang gọi trực tiếp REST API: GET /api/vehicles
                  </span>
                  <h1 className="text-2xl font-extrabold text-slate-900 mt-1.5">
                    Danh mục Xe Máy Điện EcoBike (ReactJS Frontend)
                  </h1>
                </div>

                <div className="flex flex-wrap gap-2.5">
                  <input
                    type="text"
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    placeholder="Tìm VinFast, Dat Bike, Yadea..."
                    className="px-4 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-emerald-500 w-60"
                  />
                  <select
                    value={city}
                    onChange={(e) => setCity(e.target.value)}
                    className="px-4 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-emerald-500"
                  >
                    <option value="">Tất cả thành phố</option>
                    <option value="TP. Hồ Chí Minh">TP. Hồ Chí Minh</option>
                    <option value="Hà Nội">Hà Nội</option>
                    <option value="Đà Nẵng">Đà Nẵng</option>
                  </select>
                </div>
              </div>

              <div className="flex flex-wrap gap-2 pt-3 border-t border-slate-100">
                {CATEGORIES.map((cat) => (
                  <button
                    key={cat.id}
                    onClick={() => setCategory(cat.id)}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 ${
                      category === cat.id
                        ? 'bg-emerald-600 text-white shadow-sm'
                        : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                    }`}
                  >
                    <span>{cat.label}</span>
                    <span className="px-2 py-0.5 rounded-full text-[10px] bg-black/10">{cat.badge}</span>
                  </button>
                ))}
              </div>
            </section>

            {loading ? (
              <div className="text-center py-16 text-slate-500 font-bold">
                Đang tải JSON từ Backend ASP.NET Core 9.0 Web API (/api/vehicles)...
              </div>
            ) : (
              <section className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {vehicles.map((v) => (
                  <div key={v.id} className="bg-white rounded-3xl border border-slate-100 shadow-sm hover:shadow-md transition overflow-hidden flex flex-col">
                    <div className="relative h-48 bg-slate-100 overflow-hidden">
                      <img src={v.thumbnailUrl} alt={v.model} className="w-full h-full object-cover" />
                      <div className="absolute top-3 left-3 flex flex-wrap gap-1.5">
                        <span className="px-2.5 py-1 rounded-full text-[11px] font-bold bg-slate-900/80 text-white">{v.category}</span>
                        {!v.requiresLicenseA1 && (
                          <span className="px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-600 text-white">Miễn bằng A1</span>
                        )}
                      </div>
                    </div>

                    <div className="p-5 flex-1 flex flex-col justify-between space-y-4">
                      <div>
                        <div className="text-xs font-bold text-emerald-600 uppercase">{v.brand} • {v.city}</div>
                        <h3 className="text-lg font-extrabold text-slate-900 mt-0.5">{v.brand} {v.model}</h3>
                        <div className="grid grid-cols-3 gap-2 mt-3 text-center bg-slate-50 rounded-2xl p-2.5 text-xs">
                          <div>
                            <div className="text-slate-400">Pin LFP</div>
                            <div className="font-bold text-slate-800">{v.batteryRangeKm} km</div>
                          </div>
                          <div>
                            <div className="text-slate-400">Tốc độ</div>
                            <div className="font-bold text-slate-800">{v.maxSpeedKmH} km/h</div>
                          </div>
                          <div>
                            <div className="text-slate-400">GPLX</div>
                            <div className="font-bold text-emerald-700">{v.requiresLicenseA1 ? 'Cần A1' : 'Miễn A1'}</div>
                          </div>
                        </div>
                      </div>

                      <div className="pt-3 border-t border-slate-100 flex items-center justify-between">
                        <div>
                          <span className="text-xl font-black text-emerald-600">{formatVnd(v.pricePerDay)}</span>
                          <span className="text-xs text-slate-400"> / ngày</span>
                        </div>
                        <div className="flex gap-2">
                          <button
                            onClick={() => setSelectedVehicle(v)}
                            className="px-3 py-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold text-xs"
                          >
                            Tính phí API
                          </button>
                          <a
                            href={`/Vehicles/Details/${v.id}`}
                            className="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs"
                          >
                            Đặt xe
                          </a>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </section>
            )}
          </main>

          {selectedVehicle && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div>
                    <span className="text-[11px] font-bold uppercase text-emerald-600">POST /api/bookings/calculate</span>
                    <h3 className="text-lg font-extrabold text-slate-900">{selectedVehicle.brand} {selectedVehicle.model}</h3>
                  </div>
                  <button onClick={() => setSelectedVehicle(null)} className="w-8 h-8 rounded-full bg-slate-100 font-bold">✕</button>
                </div>

                <div className="space-y-3 text-sm">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Số ngày thuê:</label>
                    <input
                      type="number"
                      min="1"
                      max="30"
                      value={days}
                      onChange={(e) => setDays(Number(e.target.value) || 1)}
                      className="w-full px-3.5 py-2 rounded-xl border border-slate-200"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Mã giảm giá (Coupon):</label>
                    <select
                      value={couponCode}
                      onChange={(e) => setCouponCode(e.target.value)}
                      className="w-full px-3.5 py-2 rounded-xl border border-slate-200"
                    >
                      <option value="">-- Không áp dụng mã --</option>
                      {coupons.map((c) => (
                        <option key={c.code} value={c.code}>
                          {c.code} (-{c.discountPercent}% tối đa {formatVnd(c.maxDiscountAmount)})
                        </option>
                      ))}
                    </select>
                  </div>
                </div>

                {quote && (
                  <div className="bg-slate-50 rounded-2xl p-4 space-y-2 text-sm border border-slate-200">
                    <div className="flex justify-between">
                      <span className="text-slate-500">Tiền thuê ({quote.days} ngày):</span>
                      <span className="font-bold">{formatVnd(quote.rentalFee)}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Bảo hiểm pin & hành trình:</span>
                      <span className="font-bold">{formatVnd(quote.insuranceFee)}</span>
                    </div>
                    {quote.discountAmount > 0 && (
                      <div className="flex justify-between text-emerald-600">
                        <span>Giảm giá ({quote.couponCode}):</span>
                        <span className="font-bold">-{formatVnd(quote.discountAmount)}</span>
                      </div>
                    )}
                    <div className="flex justify-between pt-2 border-t border-slate-200 text-base font-black">
                      <span>Tổng thanh toán:</span>
                      <span className="text-emerald-600">{formatVnd(quote.totalAmount)}</span>
                    </div>
                    <div className="flex justify-between text-xs text-slate-500">
                      <span>Tiền cọc giữ xe (30%):</span>
                      <span className="font-bold">{formatVnd(quote.depositRequired)}</span>
                    </div>
                  </div>
                )}

                <div className="flex gap-3">
                  <button onClick={() => setSelectedVehicle(null)} className="w-1/2 py-2.5 rounded-xl bg-slate-100 font-bold text-xs">Đóng</button>
                  <a href={`/Vehicles/Details/${selectedVehicle.id}`} className="w-1/2 py-2.5 rounded-xl bg-emerald-600 font-bold text-xs text-white text-center">Đặt xe ngay</a>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
