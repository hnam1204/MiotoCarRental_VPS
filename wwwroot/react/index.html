<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thuê xe máy điện - EcoBike</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CATEGORIES = [
      { id: '', label: 'Tất cả dòng xe' },
      { id: '0', label: 'Học sinh / SV (Miễn bằng A1)' },
      { id: '1', label: 'Đô thị & Đi làm' },
      { id: '2', label: 'Đường dài & Đi phượt' },
      { id: '3', label: 'Thể thao & Cao cấp' }
    ];

    const formatVnd = (n) => Number(n || 0).toLocaleString('vi-VN') + 'đ';

    function App() {
      const [vehicles, setVehicles] = useState([]);
      const [coupons, setCoupons] = useState([]);
      const [loading, setLoading] = useState(true);
      const [category, setCategory] = useState('');
      const [city, setCity] = useState('');
      const [search, setSearch] = useState('');
      const [selectedVehicle, setSelectedVehicle] = useState(null);
      const [days, setDays] = useState(2);
      const [couponCode, setCouponCode] = useState('');
      const [quote, setQuote] = useState(null);

      useEffect(() => {
        fetch('/api/coupons')
          .then(r => r.json())
          .then(setCoupons)
          .catch(console.error);
      }, []);

      useEffect(() => {
        setLoading(true);
        const params = new URLSearchParams();
        if (category !== '') params.append('category', category);
        if (city) params.append('city', city);
        if (search) params.append('search', search);

        fetch(`/api/vehicles?${params.toString()}`)
          .then(r => r.json())
          .then(data => setVehicles(data))
          .catch(console.error)
          .finally(() => setLoading(false));
      }, [category, city, search]);

      useEffect(() => {
        if (!selectedVehicle) return;
        const params = new URLSearchParams({
          vehicleId: String(selectedVehicle.id),
          days: String(days),
          couponCode: couponCode || ''
        });
        fetch(`/api/bookings/calculate?${params.toString()}`, { method: 'POST' })
          .then(r => r.json())
          .then(setQuote)
          .catch(console.error);
      }, [selectedVehicle, days, couponCode]);

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-white border-b border-gray-200 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              <a href="/" className="flex items-center gap-2 font-bold text-lg text-gray-900">
                <span className="w-8 h-8 rounded-lg bg-emerald-600 text-white flex items-center justify-center">
                  <i className="bi bi-bicycle"></i>
                </span>
                <span>Eco<span className="text-emerald-600">Bike</span></span>
              </a>

              <div className="flex items-center gap-4 text-sm font-medium text-gray-600">
                <a href="/" className="hover:text-emerald-600">Trang chủ</a>
                <a href="/Vehicles" className="hover:text-emerald-600">Thuê xe điện</a>
                <a href="/Stations" className="hover:text-emerald-600">Trạm sạc</a>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto w-full px-4 sm:px-6 py-8 space-y-6">
            <section className="bg-white rounded-xl p-5 border border-gray-200 space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-4">
                <div>
                  <h1 className="text-xl font-bold text-gray-900">Tìm kiếm xe máy điện</h1>
                  <p className="text-xs text-gray-500 mt-0.5">Chọn dòng xe phù hợp nhu cầu di chuyển của bạn</p>
                </div>

                <div className="flex flex-wrap gap-2.5">
                  <input
                    type="text"
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    placeholder="Tìm tên xe, hãng xe..."
                    className="px-3.5 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:border-emerald-600 w-56"
                  />
                  <select
                    value={city}
                    onChange={(e) => setCity(e.target.value)}
                    className="px-3.5 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:border-emerald-600"
                  >
                    <option value="">Tất cả thành phố</option>
                    <option value="TP. Hồ Chí Minh">TP. Hồ Chí Minh</option>
                    <option value="Hà Nội">Hà Nội</option>
                    <option value="Đà Nẵng">Đà Nẵng</option>
                  </select>
                </div>
              </div>

              <div className="flex flex-wrap gap-2 pt-3 border-t border-gray-100">
                {CATEGORIES.map((cat) => (
                  <button
                    key={cat.id}
                    onClick={() => setCategory(cat.id)}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-medium transition ${
                      category === cat.id
                        ? 'bg-emerald-600 text-white'
                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                    }`}
                  >
                    {cat.label}
                  </button>
                ))}
              </div>
            </section>

            {loading ? (
              <div className="text-center py-12 text-gray-500 text-sm">Đang tải danh sách xe...</div>
            ) : (
              <section className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {vehicles.map((v) => (
                  <div key={v.id} className="bg-white rounded-xl border border-gray-200 hover:shadow-md transition overflow-hidden flex flex-col">
                    <div className="relative h-48 bg-gray-100 overflow-hidden">
                      <img src={v.thumbnailUrl} alt={v.model} className="w-full h-full object-cover" />
                      {!v.requiresLicenseA1 && (
                        <span className="absolute top-3 left-3 px-2.5 py-1 rounded text-xs font-medium bg-emerald-600 text-white">
                          Miễn bằng A1
                        </span>
                      )}
                    </div>

                    <div className="p-5 flex-1 flex flex-col justify-between space-y-4">
                      <div>
                        <div className="text-xs text-gray-500">{v.brand} • {v.city}</div>
                        <h3 className="text-base font-bold text-gray-900 mt-0.5">{v.brand} {v.model}</h3>
                        <div className="grid grid-cols-3 gap-2 mt-3 bg-gray-50 rounded-lg p-2.5 text-xs border border-gray-100">
                          <div>
                            <div className="text-gray-400">Quãng đường</div>
                            <div className="font-semibold text-gray-800">{v.batteryRangeKm} km</div>
                          </div>
                          <div>
                            <div className="text-gray-400">Vận tốc</div>
                            <div className="font-semibold text-gray-800">{v.maxSpeedKmH} km/h</div>
                          </div>
                          <div>
                            <div className="text-gray-400">Bằng lái</div>
                            <div className="font-semibold text-emerald-700">{v.requiresLicenseA1 ? 'Bằng A1' : 'Miễn A1'}</div>
                          </div>
                        </div>
                      </div>

                      <div className="pt-3 border-t border-gray-100 flex items-center justify-between">
                        <div>
                          <span className="text-lg font-bold text-emerald-600">{formatVnd(v.pricePerDay)}</span>
                          <span className="text-xs text-gray-400"> / ngày</span>
                        </div>
                        <div className="flex gap-2">
                          <button
                            onClick={() => setSelectedVehicle(v)}
                            className="px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium text-xs"
                          >
                            Ước tính phí
                          </button>
                          <a
                            href={`/Vehicles/Details/${v.id}`}
                            className="px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs"
                          >
                            Đặt xe
                          </a>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </section>
            )}
          </main>

          {selectedVehicle && (
            <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl max-w-md w-full p-6 shadow-lg space-y-4">
                <div className="flex items-center justify-between border-b border-gray-100 pb-3">
                  <h3 className="text-base font-bold text-gray-900">Tính thử chi phí: {selectedVehicle.brand} {selectedVehicle.model}</h3>
                  <button onClick={() => setSelectedVehicle(null)} className="text-gray-400 hover:text-gray-600">✕</button>
                </div>

                <div className="space-y-3 text-sm">
                  <div>
                    <label className="block font-medium text-gray-700 mb-1">Số ngày thuê:</label>
                    <input
                      type="number"
                      min="1"
                      max="30"
                      value={days}
                      onChange={(e) => setDays(Number(e.target.value) || 1)}
                      className="w-full px-3 py-2 rounded-lg border border-gray-300"
                    />
                  </div>
                  <div>
                    <label className="block font-medium text-gray-700 mb-1">Mã giảm giá:</label>
                    <select
                      value={couponCode}
                      onChange={(e) => setCouponCode(e.target.value)}
                      className="w-full px-3 py-2 rounded-lg border border-gray-300"
                    >
                      <option value="">-- Không áp dụng --</option>
                      {coupons.map((c) => (
                        <option key={c.code} value={c.code}>
                          {c.code} (-{c.discountPercent}% tối đa {formatVnd(c.maxDiscountAmount)})
                        </option>
                      ))}
                    </select>
                  </div>
                </div>

                {quote && (
                  <div className="bg-gray-50 rounded-lg p-4 space-y-2 text-sm border border-gray-200">
                    <div className="flex justify-between">
                      <span className="text-gray-500">Tiền thuê ({quote.days} ngày):</span>
                      <span className="font-semibold">{formatVnd(quote.rentalFee)}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-gray-500">Phí bảo hiểm:</span>
                      <span className="font-semibold">{formatVnd(quote.insuranceFee)}</span>
                    </div>
                    {quote.discountAmount > 0 && (
                      <div className="flex justify-between text-emerald-600">
                        <span>Khuyến mãi ({quote.couponCode}):</span>
                        <span className="font-semibold">-{formatVnd(quote.discountAmount)}</span>
                      </div>
                    )}
                    <div className="flex justify-between pt-2 border-t border-gray-200 font-bold">
                      <span>Tổng cộng:</span>
                      <span className="text-emerald-600">{formatVnd(quote.totalAmount)}</span>
                    </div>
                  </div>
                )}

                <div className="flex gap-3">
                  <button onClick={() => setSelectedVehicle(null)} className="w-1/2 py-2 rounded-lg bg-gray-100 font-medium text-xs">Đóng</button>
                  <a href={`/Vehicles/Details/${selectedVehicle.id}`} className="w-1/2 py-2 rounded-lg bg-emerald-600 font-medium text-xs text-white text-center">Chi tiết & Đặt xe</a>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
