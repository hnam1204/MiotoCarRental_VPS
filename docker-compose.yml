services:
  ecobike-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecobike-rental-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/mioto.db
    volumes:
      - ecobike_sqlite_data:/app/data

volumes:
  ecobike_sqlite_data:
